<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0e9388"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 脚印整体逆时针旋转 30 度（绕画布中心 256,256） -->
  <g transform="rotate(-30 256 256)">
    <!-- 脚趾：5 个椭圆，以 x=256 为中心左右对称 -->
    <ellipse cx="196" cy="170" rx="28" ry="40" fill="url(#foot)"/>
    <ellipse cx="226" cy="138" rx="30" ry="44" fill="url(#foot)"/>
    <ellipse cx="256" cy="128" rx="32" ry="46" fill="url(#foot)"/>
    <ellipse cx="286" cy="138" rx="30" ry="44" fill="url(#foot)"/>
    <ellipse cx="316" cy="170" rx="28" ry="40" fill="url(#foot)"/>
    <!-- 脚掌主体：以 x=256 为中心左右对称的圆润胖脚 -->
    <path d="M 256 168
             C 334 168, 372 240, 360 312
             C 352 370, 316 398, 270 398
             L 242 398
             C 196 398, 160 370, 152 312
             C 140 240, 178 168, 256 168 Z"
          fill="url(#foot)"/>
    <!-- 脚掌下方的小肚肉弧线，增加可爱感 -->
    <path d="M 220 372
             C 250 392, 262 392, 292 372
             C 286 388, 270 398, 256 398
             C 242 398, 226 388, 220 372 Z"
          fill="#0e9388" opacity="0.18"/>
  </g>
</svg>
