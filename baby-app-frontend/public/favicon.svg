<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0e9388"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 脚趾：5 个椭圆，从左到右 -->
  <ellipse cx="200" cy="160" rx="30" ry="42" fill="url(#foot)"/>
  <ellipse cx="244" cy="138" rx="32" ry="46" fill="url(#foot)"/>
  <ellipse cx="288" cy="130" rx="34" ry="48" fill="url(#foot)"/>
  <ellipse cx="332" cy="142" rx="32" ry="46" fill="url(#foot)"/>
  <ellipse cx="368" cy="172" rx="28" ry="40" fill="url(#foot)"/>
  <!-- 脚掌主体：圆润胖脚 -->
  <path d="M 282 168
           C 360 168, 410 240, 396 312
           C 386 370, 348 398, 300 398
           L 300 398
           C 240 398, 196 352, 196 290
           C 196 220, 230 168, 282 168 Z"
        fill="url(#foot)"/>
  <!-- 脚掌下方的小肚肉弧线，增加可爱感 -->
  <path d="M 246 372
           C 276 392, 324 392, 354 372
           C 348 388, 326 398, 300 398
           C 274 398, 252 388, 246 372 Z"
        fill="#0e9388" opacity="0.18"/>
</svg>
