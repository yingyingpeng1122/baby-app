services:
  baby-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby-app
    # 映射到 docker0 网关 172.17.0.1，让 1Panel OpenResty 容器能反代访问
    # 不暴露到 0.0.0.0 公网，仅绑 docker0 网关
    ports:
      - "172.17.0.1:8000:8000"
    environment:
      - TURSO_DB_NAME=${TURSO_DB_NAME:-babyapp-yingyingpeng1122}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"